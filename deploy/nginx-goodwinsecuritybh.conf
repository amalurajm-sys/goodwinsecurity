# /etc/nginx/sites-available/goodwinsecuritybh.com
# Initially HTTP only; certbot --nginx adds the HTTPS server block and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name goodwinsecuritybh.com www.goodwinsecuritybh.com;

    client_max_body_size 30m;   # admin image uploads

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
